# Build every main push on the dedicated signing Mac; keys remain in its Keychain.
name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      recover_run_id:
        description: Failed Release run whose verified package is staged on the signing Mac
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: hello-chat-public-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS, ARM64, hello-chat-release]
    # The signed archive is about 1 GB. Leave room for Apple notarization
    # and GitHub uploads from the signing Mac's connection.
    timeout-minutes: 180
    outputs:
      tag: ${{ steps.draft.outputs.tag }}
      commit: ${{ steps.draft.outputs.commit }}
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      HELLOCHAT_NOTARY_PROFILE: ${{ vars.HELLOCHAT_NOTARY_PROFILE || 'HelloChatRelease' }}
      HELLOCHAT_SPARKLE_ACCOUNT: com.ethansk.HelloChat
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare isolated release paths
        shell: bash
        run: |
          set -euo pipefail
          echo "HELLOCHAT_BUILD_DIR=$RUNNER_TEMP/HelloChat.noindex" >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP/" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/Sparkle.noindex"
      - name: Fetch pinned Sparkle release tools
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://github.com/sparkle-project/Sparkle/releases/download/2.10.1/Sparkle-2.10.1.tar.xz -o "$RUNNER_TEMP/Sparkle.tar.xz"
          python3 scripts/verify-sparkle-tools.py "$RUNNER_TEMP/Sparkle.tar.xz"
          tar -xf "$RUNNER_TEMP/Sparkle.tar.xz" -C "$RUNNER_TEMP/Sparkle.noindex"
          tools="$HOME/.local/share/sparkle-tools/2.10.1/bin"
          # Provision this versioned copy during signing-host setup; reject missing or changed tools before any Keychain access.
          diff -r "$RUNNER_TEMP/Sparkle.noindex/bin" "$tools"
          echo "HELLOCHAT_SPARKLE_TOOLS=$tools" >> "$GITHUB_ENV"
      - name: Check local signing access
        shell: bash
        run: |
          set -euo pipefail
          security find-identity -v -p codesigning | grep -F 'Developer ID Application: Ethan Sarif-Kattan (T34G959ZG8)'
          xcrun notarytool history --keychain-profile "$HELLOCHAT_NOTARY_PROFILE" --output-format json >/dev/null
          expected=$(/usr/libexec/PlistBuddy -c 'Print SUPublicEDKey' Info.plist)
          actual=$("$HELLOCHAT_SPARKLE_TOOLS/generate_keys" --account "$HELLOCHAT_SPARKLE_ACCOUNT" -p)
          [[ "$actual" == "$expected" ]]
      - name: Allocate next version
        if: ${{ !inputs.recover_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          tag=$(python3 scripts/prepare-release.py --releases "$RUNNER_TEMP/releases.json" --plist Info.plist --run-number "$GITHUB_RUN_NUMBER" --commit "$GITHUB_SHA" --output "$RUNNER_TEMP/release-manifest.json")
          echo "HELLOCHAT_RELEASE_TAG=$tag" >> "$GITHUB_ENV"
      - name: Run tests
        if: ${{ !inputs.recover_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          tests=$(mktemp -d "$RUNNER_TEMP/HelloChatTests.noindex.XXXXXXXX")
          trap 'rm -rf -- "$tests"' EXIT
          HELLOCHAT_BUILD_DIR="$tests" zsh scripts/test.sh
      - name: Build signed Apple Silicon app
        if: ${{ !inputs.recover_run_id }}
        run: zsh scripts/build.sh
      - name: Notarize and sign update
        if: ${{ !inputs.recover_run_id }}
        run: zsh scripts/package-release.sh
      - name: Verify package from previous run
        if: ${{ inputs.recover_run_id }}
        shell: bash
        env:
          RECOVER_RUN_ID: ${{ inputs.recover_run_id }}
        run: |
          set -euo pipefail
          [[ "$RECOVER_RUN_ID" =~ ^[0-9]+$ ]]
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RECOVER_RUN_ID")
          source=$(jq -er 'select(.path == ".github/workflows/release.yml" and .head_branch == "main" and .status == "completed" and (.conclusion == "failure" or .conclusion == "cancelled")) | .head_sha' <<< "$run")
          [[ "$source" =~ ^[a-f0-9]{40}$ ]]
          jobs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RECOVER_RUN_ID/jobs")
          jq -e 'any(.jobs[]; any(.steps[]; .name == "Notarize and sign update" and .conclusion == "success"))' <<< "$jobs" >/dev/null
          git fetch --no-tags --depth=1 origin "$source"
          git diff --quiet "$source" "$GITHUB_SHA" -- . ':(exclude).github/workflows/release.yml' ':(exclude)RELEASE.md'
          candidate="${RUNNER_TEMP%/*}/release-recovery.noindex/$RECOVER_RUN_ID"
          mkdir -p "$HELLOCHAT_BUILD_DIR"
          for name in HelloChat-macOS-arm64.zip SHA256SUMS appcast.xml; do
            cp -c "$candidate/$name" "$HELLOCHAT_BUILD_DIR/$name"
          done
          cp "$candidate/release-manifest.json" "$RUNNER_TEMP/release-manifest.json"
          receipt="$RUNNER_TEMP/release-manifest.json"
          tag=$(jq -er --arg commit "$source" 'select(.commit == $commit and .tag == ("v" + .version)) | .tag' "$receipt")
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          draft=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish)
          jq -e --arg commit "$source" '.isDraft and .targetCommitish == $commit' <<< "$draft" >/dev/null
          cd "$HELLOCHAT_BUILD_DIR"
          shasum -a 256 -c SHA256SUMS
          signature=$(python3 -c 'import xml.etree.ElementTree as ET; print(ET.parse("appcast.xml").find("channel/item/enclosure").attrib["{http://www.andymatuschak.org/xml-namespaces/sparkle}edSignature"])')
          "$HELLOCHAT_SPARKLE_TOOLS/sign_update" --account "$HELLOCHAT_SPARKLE_ACCOUNT" --verify HelloChat-macOS-arm64.zip "$signature"
          ditto -x -k HelloChat-macOS-arm64.zip .
          codesign --verify --deep --strict HelloChat.app
          codesign -dv --verbose=3 HelloChat.app 2>&1 | grep -Fx 'TeamIdentifier=T34G959ZG8'
          xcrun stapler validate HelloChat.app
          spctl --assess --type execute --verbose=2 HelloChat.app
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' HelloChat.app/Contents/Info.plist)" = com.ethansk.HeyChat
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' HelloChat.app/Contents/Info.plist)" = "${tag#v}"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' HelloChat.app/Contents/Info.plist)" = "$(jq -er .build "$receipt")"
          printf 'HELLOCHAT_RELEASE_TAG=%s\nHELLOCHAT_RELEASE_COMMIT=%s\n' "$tag" "$source" >> "$GITHUB_ENV"
      - name: Prepare immutable draft
        id: draft
        shell: bash
        run: |
          set -euo pipefail
          # Keep publication bound to the verified source after concurrent
          # workflow edits; the existing Keychain login has workflow permission.
          unset GH_TOKEN GITHUB_TOKEN
          test "$(gh api --hostname github.com user --jq .login)" = EthanSK
          release_commit="${HELLOCHAT_RELEASE_COMMIT:-$GITHUB_SHA}"
          display_name=$(/usr/libexec/PlistBuddy -c 'Print CFBundleName' "$HELLOCHAT_BUILD_DIR/HelloChat.app/Contents/Info.plist")
          if release=$(gh release view "$HELLOCHAT_RELEASE_TAG" --json isDraft,targetCommitish); then
            jq -e --arg commit "$release_commit" '.isDraft and .targetCommitish == $commit' <<< "$release" >/dev/null
          else
            gh release create "$HELLOCHAT_RELEASE_TAG" --draft --target "$release_commit" \
              --title "$display_name ${HELLOCHAT_RELEASE_TAG#v}" --generate-notes \
              --notes 'Signed and notarized for Apple Silicon Macs running macOS 15 or later. Existing installations can use Check for Updates.'
          fi
          if ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$HELLOCHAT_RELEASE_TAG"); then
            jq -e --arg commit "$release_commit" '.object.type == "commit" and .object.sha == $commit' <<< "$ref" >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$HELLOCHAT_RELEASE_TAG" -f sha="$release_commit"
          fi
          printf 'tag=%s\ncommit=%s\n' "$HELLOCHAT_RELEASE_TAG" "$release_commit" >> "$GITHUB_OUTPUT"
          cp "$RUNNER_TEMP/release-manifest.json" "$HELLOCHAT_BUILD_DIR/release-manifest.json"
      - name: Transfer signed package
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-${{ github.run_id }}
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
          path: |
            ${{ env.HELLOCHAT_BUILD_DIR }}/HelloChat-macOS-arm64.zip
            ${{ env.HELLOCHAT_BUILD_DIR }}/SHA256SUMS
            ${{ env.HELLOCHAT_BUILD_DIR }}/appcast.xml
            ${{ env.HELLOCHAT_BUILD_DIR }}/release-manifest.json

  publish:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      HELLOCHAT_RELEASE_TAG: ${{ needs.release.outputs.tag }}
      HELLOCHAT_RELEASE_COMMIT: ${{ needs.release.outputs.commit }}
    steps:
      - name: Prepare download paths
        shell: bash
        run: echo "HELLOCHAT_BUILD_DIR=$RUNNER_TEMP/package.noindex" >> "$GITHUB_ENV"
      - name: Download signed package
        uses: actions/download-artifact@v4
        with:
          name: signed-release-${{ github.run_id }}
          path: ${{ env.HELLOCHAT_BUILD_DIR }}
      - name: Verify signed package receipt
        shell: bash
        run: |
          set -euo pipefail
          cd "$HELLOCHAT_BUILD_DIR"
          shasum -a 256 -c SHA256SUMS
          jq -e --arg commit "$HELLOCHAT_RELEASE_COMMIT" --arg tag "$HELLOCHAT_RELEASE_TAG" '.commit == $commit and .tag == $tag' release-manifest.json >/dev/null
          cp release-manifest.json "$RUNNER_TEMP/release-manifest.json"
      - name: Publish immutable release
        shell: bash
        run: |
          set -euo pipefail
          release=$(gh release view "$HELLOCHAT_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish,databaseId)
          jq -e --arg commit "$HELLOCHAT_RELEASE_COMMIT" '.isDraft and .targetCommitish == $commit' <<< "$release" >/dev/null
          release_id=$(jq -er .databaseId <<< "$release")
          asset_api="repos/$GITHUB_REPOSITORY/releases/$release_id/assets"
          # GitHub exposes a digest for each fully accepted asset. After a
          # failed network response, read back before deciding to retry.
          for file in "$HELLOCHAT_BUILD_DIR/HelloChat-macOS-arm64.zip" \
                      "$HELLOCHAT_BUILD_DIR/SHA256SUMS" "$HELLOCHAT_BUILD_DIR/appcast.xml" \
                      "$RUNNER_TEMP/release-manifest.json"; do
            name=${file##*/}
            digest="sha256:$(shasum -a 256 "$file" | awk '{print $1}')"
            for attempt in 1 2 3; do
              assets=$(gh api "$asset_api")
              asset=$(jq -r --arg name "$name" '.[] | select(.name == $name and .state == "uploaded") | .digest // "unverified"' <<< "$assets")
              if [[ "$asset" == "$digest" ]]; then break; fi
              [[ -z "$asset" ]] || exit 1
              # GitHub can leave an uncommitted starter record after a failed
              # upload. Clear only that exact placeholder on our verified draft.
              starter=$(jq -r --arg name "$name" '.[] | select(.name == $name and .state == "starter") | .id' <<< "$assets")
              if [[ -n "$starter" ]]; then
                [[ "$starter" =~ ^[0-9]+$ ]]
                gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$starter"
              fi
              if gh release upload "$HELLOCHAT_RELEASE_TAG" "$file" --repo "$GITHUB_REPOSITORY"; then break; fi
              [[ "$attempt" == 3 ]] || sleep 15
            done
            gh api "$asset_api" | jq -e --arg name "$name" --arg digest "$digest" \
              'any(.name == $name and .state == "uploaded" and .digest == $digest)' >/dev/null
          done
          gh release edit "$HELLOCHAT_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
      - name: Verify published bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/downloaded.noindex"
          cd "$RUNNER_TEMP/downloaded.noindex"
          for name in HelloChat-macOS-arm64.zip SHA256SUMS appcast.xml release-manifest.json; do
            curl --fail --silent --show-error --location --retry 3 --connect-timeout 20 --max-time 900 \
              "https://github.com/$GITHUB_REPOSITORY/releases/download/$HELLOCHAT_RELEASE_TAG/$name" -o "$name"
          done
          shasum -a 256 -c SHA256SUMS
          cmp appcast.xml "$HELLOCHAT_BUILD_DIR/appcast.xml"
          cmp release-manifest.json "$RUNNER_TEMP/release-manifest.json"
